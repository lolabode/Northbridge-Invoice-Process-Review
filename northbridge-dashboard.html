<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Approval Dashboard | Northbridge Supplies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#E9EEF3; --tile:#FFFFFF; --ink:#1B2B3D; --muted:#66778A; --line:#E1E7ED;
  --top:#1F3A5A; --topink:#FFFFFF; --bar:#2F6FA8; --good:#2E8B5E; --bad:#C8432F; --target:#D9971A; --track:#E6ECF1;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0E1620; --tile:#172331; --ink:#E5ECF2; --muted:#93A5B8; --line:#26364A;
  --top:#122437; --topink:#FFFFFF; --bar:#5C9BD6; --good:#56BE8B; --bad:#EE7461; --target:#EBB342; --track:#24344A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --canvas:#0E1620; --tile:#172331; --ink:#E5ECF2; --muted:#93A5B8; --line:#26364A;
  --top:#122437; --topink:#FFFFFF; --bar:#5C9BD6; --good:#56BE8B; --bad:#EE7461; --target:#EBB342; --track:#24344A; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.top{background:var(--top);color:var(--topink)}
.top .in{max-width:1320px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand b{display:block;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:.82rem;opacity:.75}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters button{font:inherit;font-size:.85rem;color:var(--topink);background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:6px 8px;min-height:34px}
.filters select option{color:#1B2B3D}
.filters button{cursor:pointer}
.filters .f{display:flex;align-items:center;gap:6px}
.filters label{font-size:.75rem;opacity:.8;margin-right:-2px}
:focus-visible{outline:3px solid var(--target);outline-offset:2px}
main{max-width:1320px;margin:0 auto;padding:16px 20px 12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--tile);border-radius:8px;padding:14px 16px 12px;border-top:4px solid var(--bad)}
.kpi.ok{border-top-color:var(--good)}
.kpi .lab{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi .val{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px;line-height:1.1}
.kpi .tr{position:relative;height:6px;background:var(--track);border-radius:3px}
.kpi .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--bad);transition:width .3s}
.kpi.ok .tr i{background:var(--good)}
.kpi .tr b{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink)}
.kpi .foot{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;margin-top:8px;color:var(--muted)}
.kpi .foot em{font-style:normal;font-weight:700;color:var(--bad)}
.kpi.ok .foot em{color:var(--good)}
.row{display:grid;gap:12px;margin-top:12px}
.r1{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.r2{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.tile{background:var(--tile);border-radius:8px;padding:14px 16px;min-width:0}
.tile h2{font-size:.95rem;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile h2 label{font-size:.78rem;font-weight:500;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;fill:var(--muted);font-size:11px}
.tw{overflow:auto;max-height:262px}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--tile);color:var(--muted);font-weight:600}
.num{text-align:right}
.total{font-weight:700}
.empty{color:var(--muted);padding:12px 0;margin:0}
footer{max-width:1320px;margin:0 auto;padding:4px 20px 18px;color:var(--muted);font-size:.75rem}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.r1,.r2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.kpis{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand"><b>Invoice Approval Dashboard</b><span>Northbridge Supplies, 2025</span></div>
  <div class="filters" role="group" aria-label="Filters">
    <span class="f"><label for="fDept">Department</label><select id="fDept"></select></span>
    <span class="f"><label for="fCh">Received by</label><select id="fCh"></select></span>
    <span class="f"><label for="fPo">PO status</label><select id="fPo"></select></span>
    <button id="reset" type="button">Reset</button>
  </div>
</div></div>

<main>
  <div class="kpis" id="kpis"></div>
  <div class="row r1">
    <div class="tile"><h2>Paid on time by month</h2><div id="cMonth"></div></div>
    <div class="tile"><h2>Days to approve <label><input type="checkbox" id="matchedOnly" checked> Matched POs only</label></h2><div id="cAppr"></div></div>
  </div>
  <div class="row r2">
    <div class="tile"><h2>PO problems by department</h2><div id="cPo"></div></div>
    <div class="tile"><h2 id="dupTitle">Duplicate payments</h2><div class="tw" id="dupTable"></div></div>
  </div>
</main>
<footer>Portfolio project by Felicia Oyebode.</footer>

function bars(id,items,fmt,hot){
  if(!items.length){$(id).innerHTML='<p class="empty">No data.</p>';return}
  const W=460,rh=25,L=128,R=52,H=items.length*rh;const mx=Math.max(...items.map(i=>i[1]))||1;
  let g="";items.forEach(([l,v],k)=>{const y=k*rh,w=(W-L-R)*v/mx;
    g+=`<text x="${L-8}" y="${y+16}" text-anchor="end" style="fill:var(--ink)">${l}</text><rect x="${L}" y="${y+5}" width="${Math.max(1,w)}" height="15" rx="2" fill="${v>=hot?"var(--bad)":"var(--bar)"}"><title>${l}: ${fmt(v)}</title></rect><text x="${L+w+5}" y="${y+16}" style="fill:var(--ink);font-weight:600">${fmt(v)}</text>`});
  $(id).innerHTML=svg(W,H,g);
}
function appr(rs){const x=$("matchedOnly").checked?rs.filter(r=>D.cats.po_match_status[r[C.po]]==="Matched"):rs;const b={};
  x.forEach(r=>{(b[r[C.ro]]=b[r[C.ro]]||[]).push(r[C.da])});
  bars("cAppr",Object.entries(b).map(([k,a])=>[D.cats.budget_holder_role[k],a.reduce((s,v)=>s+v,0)/a.length]).sort((a,c)=>c[1]-a[1]),v=>n1(v)+"d",10)}
function po(rs){const b={};rs.forEach(r=>{const k=r[C.dp];b[k]=b[k]||[0,0];b[k][0]++;if(D.cats.po_match_status[r[C.po]]!=="Matched")b[k][1]++});
  bars("cPo",Object.entries(b).map(([k,a])=>[D.cats.department[k],a[1]/a[0]]).sort((a,c)=>c[1]-a[1]),v=>Math.round(v*100)+"%",.4)}
function dups(){const x=D.dups.filter(r=>set.has(r[0])).sort((a,b)=>b[3]-a[3]);
  $("dupTitle").textContent=`Duplicate payments (${x.length})`;
  if(!x.length){$("dupTable").innerHTML='<p class="empty">None for this selection.</p>';return}
  const tot=x.reduce((a,r)=>a+r[3],0);
  $("dupTable").innerHTML=`<table><thead><tr><th>Supplier</th><th>Invoice</th><th class="num">Amount</th><th>Paid</th><th>Paid again</th></tr></thead><tbody>${
    x.map(r=>`<tr><td>${r[1]}</td><td>${r[2]}</td><td class="num">£${r[3].toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join("")
  }<tr class="total"><td>Total</td><td></td><td class="num">${gbp(tot)}</td><td></td><td></td></tr></tbody></table>`}
function render(){const d=+$("fDept").value,c=+$("fCh").value,p=+$("fPo").value;const idx=[];
  D.rows.forEach((r,i)=>{if((d<0||r[C.dp]===d)&&(c<0||r[C.ch]===c)&&(p<0||r[C.po]===p))idx.push(i)});
  set=new Set(idx);const rs=idx.map(i=>D.rows[i]);kpis(rs);monthChart(rs);appr(rs);po(rs);dups()}
["fDept","fCh","fPo","matchedOnly"].forEach(id=>$(id).addEventListener("change",render));
$("reset").addEventListener("click",()=>{["fDept","fCh","fPo"].forEach(id=>$(id).value="-1");render()});
render();
</script>
</body>
</html>
